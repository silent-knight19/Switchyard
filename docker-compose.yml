services:
  postgres:
    image: postgres:16.8-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-switchyard-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-switchyard}
      POSTGRES_USER: ${POSTGRES_USER:-switchyard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-switchyard_dev_password}
      GATEWAY_APP_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:-switchyard_app_password}
      GATEWAY_MIGRATOR_PASSWORD: ${MIGRATE_POSTGRES_PASSWORD:-switchyard_migrator_password}
      GATEWAY_STARTUP_PASSWORD: ${GATEWAY_STARTUP_PASSWORD:-switchyard_startup_password}
      GATEWAY_WORKER_PASSWORD: ${GATEWAY_WORKER_PASSWORD:-switchyard_worker_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/gateway/src/db/bootstrap/provision-roles.sql:/docker-entrypoint-initdb.d/01-provision-roles.sql:ro
      - ./docker/postgres/init/02-init-development.sh:/docker-entrypoint-initdb.d/02-init-development.sh:ro
    networks:
      - switchyard-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-switchyard} -d ${POSTGRES_DB:-switchyard}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    container_name: ${REDIS_CONTAINER_NAME:-switchyard-redis}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-switchyard_dev_password}
      REDIS_APP_USER: ${REDIS_APP_USER:-switchyard_app}
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD:-switchyard_app_password}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-switchyard_dev_password}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-64mb}
    command:
      - /bin/sh
      - -c
      - |
        printf "appendonly yes\nappendfsync everysec\nmaxmemory %s\nmaxmemory-policy noeviction\nrequirepass %s\nuser default on >%s ~* &* +@all\nuser %s on >%s ~* &* +@all -@admin -@dangerous +info -FLUSHALL -FLUSHDB -CONFIG -DEBUG -SHUTDOWN -REPLICAOF -KEYS\n" "$$REDIS_MAXMEMORY" "$$REDIS_PASSWORD" "$$REDIS_PASSWORD" "$$REDIS_APP_USER" "$$REDIS_APP_PASSWORD" | exec redis-server -
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - switchyard-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          set -f &&
          redis-cli ping | grep -q PONG &&
          redis-cli info memory | grep -q 'maxmemory_policy:noeviction' &&
          redis-cli info persistence | grep -q 'aof_enabled:1' &&
          [ "$${REDIS_APP_USER:-switchyard_app}" != "default" ] &&
          for cmd in "FLUSHALL" "FLUSHDB" "CONFIG GET maxmemory" "DEBUG OBJECT x" "SHUTDOWN" "REPLICAOF NO ONE" "KEYS *" "ACL LIST"; do
            res=$$(redis-cli ACL DRYRUN "$${REDIS_APP_USER:-switchyard_app}" $$cmd) &&
            echo "$$res" | grep -qi "no permissions" || exit 1;
          done
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${MIGRATE_CONTAINER_NAME:-switchyard-migrate}
    restart: "no"
    command: ["node", "apps/gateway/dist/db/migrate.js", "--apply"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-switchyard}
      MIGRATE_POSTGRES_USER: gateway_migrator
      MIGRATE_POSTGRES_PASSWORD: ${MIGRATE_POSTGRES_PASSWORD:-switchyard_migrator_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - switchyard-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${GATEWAY_CONTAINER_NAME:-switchyard-gateway}
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-switchyard}
      POSTGRES_USER: ${GATEWAY_POSTGRES_USER:-gateway_app}
      POSTGRES_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:-switchyard_app_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_APP_USER:-switchyard_app}
      REDIS_PASSWORD: ${REDIS_APP_PASSWORD:-switchyard_app_password}
      REDIS_MAXMEMORY_POLICY: noeviction
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    networks:
      - switchyard-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  mock-upstream:
    build:
      context: .
      dockerfile: docker/mock-upstream/Dockerfile
    container_name: ${MOCK_UPSTREAM_CONTAINER_NAME:-switchyard-mock-upstream}
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      MOCK_CONTROL_SECRET: ${MOCK_CONTROL_SECRET:-}
    networks:
      - switchyard-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

networks:
  switchyard-network:
    name: ${NETWORK_NAME:-switchyard-network}
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-switchyard_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-switchyard_redis_data}
